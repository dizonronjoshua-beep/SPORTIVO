<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="SPORTIVO Management System" name="description"/>
  <title>
   Forgot Password | SPORTIVO
  </title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="assets/css/styles.css" rel="stylesheet"/>
  <link href="assets/css/modules/public/forgot-password.css" rel="stylesheet"/>
   <link href="assets/css/palette.css" rel="stylesheet"/>
  <link href="assets/css/v65-integrated.css" rel="stylesheet"/>
</head>
 <body>
  <main class="auth-page">
   <section class="auth-card" style="max-width:900px;height:min(620px,90vh)">
    <aside class="auth-side">
     <a class="brand" href="index.html" style="color:#fff">
      <span class="brand-dots">
       <i>
       </i>
       <i>
       </i>
       <i>
       </i>
      </span>
      <strong>
       SPORTIVO
      </strong>
     </a>
     <div>
      <span class="eyebrow light">
       ACCOUNT RECOVERY
      </span>
      <h1>
       Reset
       <br/>
       access.
      </h1>
     </div>
    </aside>
    <section class="auth-panel">
     <a class="icon-btn auth-close" href="login.html">
      ×
     </a>
     <span class="eyebrow">
      FORGOT PASSWORD
     </span>
     <h2>
      Reset Password
     </h2>
     <form class="auth-form" id="forgotForm">
      <div class="field">
       <label>
        Email Address *
       </label>
       <input name="email" required="" type="email"/>
      </div>
      <div class="field">
       <label>
        New Password *
       </label>
       <input minlength="6" name="password" required="" type="password"/>
      </div>
      <div class="field">
       <label>
        Confirm Password *
       </label>
       <input minlength="6" name="confirm" required="" type="password"/>
      </div>
      <button class="btn btn-dark full">
       Reset Password
      </button>
      <div class="auth-status" id="authStatus">
      </div>
     </form>
    </section>
   </section>
  </main>
  <div class="modal-backdrop" id="modalRoot">
  </div>
  <div class="toast">
  </div>
  <script type="module" src="/assets/js/supabase.js"></script>
  <script src="assets/js/app.js">
  </script>
  <script src="assets/js/modules/public/forgot-password.js">
  </script>
 </body>
</html>
